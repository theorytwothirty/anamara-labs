<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../gun/kit/web.css"><link rel="stylesheet" href="../app.css">
<script src="../gun/kit/web.js"></script>

<form id="form" class="card list">
  <p class="cap">Profile</p>
  <label>Name <input name="name" required maxlength="100" autocomplete="name"></label>
  <label>Email <input name="mail" type="email" disabled></label>
  <div class="line tiny soft">
    <span>Plan <b name="plan" class="tag"></b></span>
    <span>Email verified <b name="ok" class="tag"></b></span>
  </div>
  <p class="cap split">Session preferences</p>
  <label>Voice
    <select name="voice">
      <option value="calm_female">Calm female</option>
      <option value="calm_male">Calm male</option>
      <option value="warm_female">Warm female</option>
      <option value="warm_male">Warm male</option>
    </select>
  </label>
  <label><span class="line"><span class="grow">Session length</span><b name="mins" class="tag">20</b> min</span><input name="len" type="range" min="5" max="45" step="5" value="20"></label>
  <label class="line tick"><input name="bg" type="checkbox"> <span class="grow">Background sounds</span></label>
  <p class="cap split">Email</p>
  <label class="line tick"><input name="weekly" type="checkbox"> <span class="grow">A short summary of your week, on Mondays</span></label>
  <p name="err" class="bad" hidden></p>
  <p name="saved" class="good" hidden>Saved</p>
  <button class="big" name="act">Save changes</button>
</form>

<style>
.split { margin-top: var(--s4); padding-top: var(--s4); border-top: 1px solid var(--line); }
.tick { flex-wrap: nowrap; color: var(--ink); }
</style>

<script src="../gun/kit/dom.js"></script>
<script src="../env.js"></script>
<script src="../api.js"></script>
<script src="../fit.js"></script>
<script>
// body: a user {name, mail, plan, ok, pref: {voice, len, bg, weekly}}.
kit.createServer(function(req, res){ ME.fill(req.body || {}); res.send(document) });

var ME = {};
ME.fill = function(u, p){ p = u.pref || {};
  kit.bind(document, {name: u.name, mail: u.mail, plan: u.plan, ok: u.ok, voice: p.voice, len: p.len, mins: p.len, err: null, saved: null});
  form.bg.checked = !!p.bg; form.weekly.checked = !!p.weekly;
};
ME.send = async function(eve, f){ eve.preventDefault();
  f = Object.fromEntries(new FormData(form)); f.bg = form.bg.checked; f.weekly = form.weekly.checked;
  form.act.disabled = true; kit.bind(document, {err: null, saved: null});
  try{ ME.fill(FIT.user(await API.ask('/users/me', FIT.me(f), 'PATCH'))); kit.bind(document, {saved: {}}) }
  catch(err){ kit.bind(document, {err: err.message}) }
  form.act.disabled = false;
};
form.ear('submit', ME.send);
form.len.ear('input', function(){ kit.bind(document, {mins: form.len.value}) });
</script>
