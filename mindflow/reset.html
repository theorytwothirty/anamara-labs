<!doctype html>
<meta charset="utf-8">
<title>New password · MindFlow</title>
<link rel="stylesheet" href="gun/kit/web.css"><link rel="stylesheet" href="app.css">
<script src="gun/kit/web.js"></script>

<div class="pad slim flow">
  <p class="calm"><span><a class="mark" href="home.html">MindFlow</a> <span class="soft tiny">by Anamara Labs</span></span></p>
  <div id="bad" class="card list">
    <h2>This link doesn't work</h2>
    <p class="soft">This password reset link is missing or invalid. Request a new one.</p>
    <a class="btn" href="lost.html">Request new link</a>
  </div>
  <form id="form" class="card list" hidden>
    <h2>Choose a new password</h2>
    <label>New password <input name="pass" type="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="At least 8 characters"></label>
    <p name="err" class="bad" hidden></p>
    <button class="big" name="act">Reset password</button>
  </form>
  <div id="done" class="card list" hidden>
    <h2>Password updated</h2>
    <p class="soft">Your password has been updated. You can now sign in.</p>
    <a class="btn big" href="sign.html">Sign in</a>
  </div>
</div>

<script src="gun/kit/dom.js"></script>
<script src="env.js"></script>
<script src="api.js"></script>
<script src="nav.js"></script>
<script>
kit.createServer(function(req, res){
  RESET.token = (req.body || {}).token || '';
  RESET.show(RESET.token ? form : bad);
  res.send(kit.bind(document, {err: null}));
});

var RESET = {};
RESET.show = function(one){ [bad, form, done].forEach(function(el){ el.hidden = el !== one }) };
RESET.send = async function(eve){ eve.preventDefault();
  kit.bind(document, {err: null, act: 'Saving…'}); form.act.disabled = true;
  try{
    await API.ask('/auth/reset-password', {token: RESET.token, new_password: form.pass.value});
    RESET.show(done);
  }catch(err){ kit.bind(document, {err: err.message}) }
  kit.bind(document, {act: 'Reset password'}); form.act.disabled = false;
};
form.ear('submit', RESET.send);
</script>
