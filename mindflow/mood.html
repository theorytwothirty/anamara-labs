<!doctype html>
<meta charset="utf-8">
<title>Progress · MindFlow</title>
<link rel="stylesheet" href="gun/kit/web.css"><link rel="stylesheet" href="app.css">
<script src="gun/kit/web.js"></script>

<div class="pad flow">
  <header class="list">
    <p class="cap">Progress</p>
    <h1>Your practice</h1>
    <p class="lead">A record of the time you've given yourself.</p>
  </header>
  <p name="err" class="bad" hidden></p>
  <section class="card list">
    <div class="line"><b name="count" class="num huge">0</b><span class="grow soft">practices completed</span></div>
    <div class="line tiny soft"><span class="grow">Habit success rate <b name="rate">--</b></span><span class="grow">Habit logs <b name="logs">0</b></span></div>
    <p class="soft tiny">Practicing regularly builds the habit. Real change shows up in how you feel and respond in daily life, so notice that too.</p>
  </section>
  <iframe id="chart" src="mood/chart.html" title="How you've been feeling"></iframe>
  <iframe id="steps" src="mood/steps.html" title="Real-world steps"></iframe>
  <section id="tips" class="card list" hidden><p class="cap">Insights</p><ul id="box" class="list"></ul></section>
  <button id="csv" class="hug">Download my progress (CSV)</button>
  <a id="file" download="mindflow_progress.csv" hidden></a>
</div>
<template id="row"><li><span name="text"></span></li></template>

<style>
.huge { font-size: var(--t1); }
#box li { padding-left: var(--s4); border-left: 3px solid var(--lilact); }
</style>

<script src="gun/kit/dom.js"></script>
<script src="env.js"></script>
<script src="api.js"></script>
<script src="fit.js"></script>
<script src="row.js"></script>
<script src="nav.js"></script>
<script>
// No body needed: every show reloads the summary.
kit.createServer(async function(req, res){
  var s;
  API.ask('/actions').then(function(a){ return kit.fetch(steps, a.map(FIT.act)) }).catch(Boolean);
  try{ s = FIT.sum(await API.ask('/progress/summary')) }catch(err){ return res.send(kit.bind(document, {err: err.message})) }
  kit.fetch(chart, s.trend).catch(Boolean);
  tips.hidden = !s.tips.length;
  ROW.fill(box, row, s.tips.map(function(t){ return {text: t} }));
  res.send(kit.bind(document, {err: null, count: s.count, logs: s.logs, rate: null == s.rate ? '--' : Math.round(s.rate * 100) + '%'}));
});

csv.ear('click', async function(){
  csv.disabled = true; kit.bind(document, {err: null});
  try{ await API.save('/progress/export', file) }catch(err){ kit.bind(document, {err: err.message}) }
  csv.disabled = false;
});
</script>
