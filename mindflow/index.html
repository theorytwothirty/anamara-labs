<style>
iframe.page:not(.main) { display: none; }
#bar {
  position: fixed; z-index: 9; left: 0; right: 0; margin: 0 auto; bottom: max(10px, env(safe-area-inset-bottom));
  width: min(100% - 20px, 30rem); display: flex; padding: 6px; gap: 2px; border-radius: 999px;
  background: rgba(255,255,255,0.82); border: 1px solid var(--line); box-shadow: var(--lift2);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4); backdrop-filter: blur(var(--blur)) saturate(1.4);
}
#bar a { flex: 1; min-height: 52px; display: grid; place-items: center; gap: 0; border-radius: 999px; color: var(--mute); font-size: 0.7rem; font-weight: 600; transition: color var(--time), background-color var(--time); }
#bar a:hover { color: var(--ink); }
#bar a.on { color: var(--rose); background: var(--roset); }
body.out #bar, body.still #bar { display: none; }
</style>

<script src="gun/kit/dom.js"></script>
<script src="env.js"></script>
<script src="api.js"></script>
<script>;(function(){
var APP = {start: 'dash.html', open: 'home.html sign.html join.html lost.html reset.html verify.html support.html'.split(' ')};
// Only this app's own pages may load into a frame: a relative path of plain words ending in .html, plus a query.
APP.safe = /^[a-z0-9]+(\/[a-z0-9]+)*\.html(\?[A-Za-z0-9_.~%=&-]*)?$/;

// path: 'play.html?id=1' or a full URL from a component. Shows that page and asks it to (re)load.
APP.show = function(path, page, view){
  path = (path || location.hash.slice(1) || APP.start).replace(location.__dirname + '/', '');
  if(!APP.safe.test(path)){ path = APP.start }
  page = path.split('?')[0];
  if(!API.tok() && APP.open.indexOf(page) < 0){ path = page = 'home.html' }
  if(API.tok() && 'home.html' === page){ path = page = APP.start }
  document.body.tag('out', API.tok() ? -1 : 1);
  document.body.tag('still', 'play.html' === page ? 1 : -1);
  document.body.all('#bar a').forEach(function(a){ a.tag('on', a.getAttribute('href') === page ? 1 : -1) });
  if(path !== APP.now){ window.scrollTo(0, 0); document.body.scrollTop = 0 }
  APP.now = path; location.path = path;
  view = document.getElementById(path);
  kit.fetch(view, kit.querystring.parse(path.split('?')[1] || '')).catch(function(){});
};

kit.ear('go', function(eve){ eve.preventDefault(); APP.show(eve.detail) });
document.body.all('#bar a').ear('click', function(eve){ eve.preventDefault(); APP.show(this.getAttribute('href')) });
// Runs before Kit's own hashchange router (registered later, on DOMContentLoaded) and stops unsafe hashes reaching it.
window.addEventListener('hashchange', function(eve){
  if(APP.safe.test(location.hash.slice(1))){ return }
  eve.stopImmediatePropagation(); history.replaceState(null, '', '#' + (APP.now || APP.start));
});
window.addEventListener('hashchange', function(){ setTimeout(function(){
  if(location.hash.slice(1) !== APP.now){ APP.show() }
}) });
window.addEventListener('DOMContentLoaded', function(){ APP.show() });
}());
</script>
