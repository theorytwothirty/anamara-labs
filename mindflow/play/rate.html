<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../gun/kit/web.css"><link rel="stylesheet" href="../app.css">
<script src="../gun/kit/web.js"></script>

<form id="form" class="card list calm">
  <p class="cap">Practice complete</p>
  <h2>Well done for showing up.</h2>
  <p class="soft">How helpful was this practice for you?</p>
  <div id="stars" class="line" role="group" aria-label="Rating">
    <button type="button" class="star" value="1" aria-label="1 star">★</button>
    <button type="button" class="star" value="2" aria-label="2 stars">★</button>
    <button type="button" class="star" value="3" aria-label="3 stars">★</button>
    <button type="button" class="star" value="4" aria-label="4 stars">★</button>
    <button type="button" class="star" value="5" aria-label="5 stars">★</button>
  </div>
  <label>What did you notice? (optional)
    <textarea name="note" maxlength="500" placeholder="A feeling, an image, something you'd like to try for real…"></textarea>
  </label>
  <p name="err" class="bad" hidden></p>
  <button class="big" name="act">Save reflection</button>
  <a class="btn ghost" href="../shelf.html">Skip for now</a>
</form>

<style>
#stars { justify-content: center; gap: var(--s1); flex-wrap: nowrap; }
.star { width: var(--tap); padding: 0; font-size: 1.7rem; color: #d9cdd6; background: transparent; border-color: transparent; box-shadow: none; }
.star:hover { color: #e3b35d; background: transparent; border-color: transparent; box-shadow: none; }
.star.on { color: #d99a2b; background: transparent; border-color: transparent; }
label { text-align: left; }
</style>

<script src="../gun/kit/dom.js"></script>
<script src="../env.js"></script>
<script src="../api.js"></script>
<script src="../nav.js"></script>
<script>
// body: {id} of the session that just finished.
kit.createServer(function(req, res){
  RATE.id = (req.body || {}).id; form.reset(); RATE.pick(0);
  res.send(kit.bind(document, {err: null}));
});

var RATE = {};
RATE.pick = function(n){ RATE.n = +n; stars.all('button').forEach(function(b){ b.tag('on', +b.value <= RATE.n ? 1 : -1); b.setAttribute('aria-pressed', +b.value <= RATE.n) }) };
RATE.send = async function(eve){ eve.preventDefault();
  form.act.disabled = true; kit.bind(document, {err: null});
  try{
    await API.ask('/sessions/' + encodeURIComponent(RATE.id) + '/complete', {rating: RATE.n || null, user_notes: form.note.value || null});
    NAV.go('../shelf.html');
  }catch(err){ kit.bind(document, {err: err.message}) }
  form.act.disabled = false;
};
stars.all('button').ear('click', function(){ RATE.pick(this.value) });
form.ear('submit', RATE.send);
</script>
