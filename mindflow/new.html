<!doctype html>
<meta charset="utf-8">
<title>Practice · MindFlow</title>
<link rel="stylesheet" href="gun/kit/web.css"><link rel="stylesheet" href="app.css">
<script src="gun/kit/web.js"></script><script src="env.js"></script>

<div class="pad flow">
  <header class="list">
    <p class="cap">Practice</p>
    <h1>What's on your mind?</h1>
    <p class="lead">Tell me about a situation where you'd like to feel or respond differently.</p>
  </header>
  <div class="tabs" role="group" aria-label="Kind of practice">
    <button id="tabframe" class="on" aria-pressed="true">Shift my state</button>
    <button id="tabdeep" aria-pressed="false">Practice becoming</button>
  </div>
  <iframe id="frame" src="new/frame.html" title="Shift my state"></iframe>
  <iframe id="deep" src="new/deep.html" title="Practice becoming" hidden></iframe>
</div>

<script src="gun/kit/dom.js"></script>
<script src="nav.js"></script>
<script>
// body: {tab: 'frame' | 'deep'} picks a tab; otherwise the current one stays, with any work in progress.
// A "practice again" from Today leaves its focus in sessionStorage.again, to start the situation with.
kit.createServer(function(req, res, seed){
  (req.body || {}).tab && NEW.pick((req.body || {}).tab);
  try{ seed = sessionStorage.again; sessionStorage.removeItem('again') }catch(err){}
  seed && kit.fetch(frame, {issue: seed}).catch(Boolean);
  res.send(document);
});

var NEW = {};
NEW.pick = function(tab){
  frame.hidden = 'frame' !== tab; deep.hidden = 'deep' !== tab;
  [[tabframe, frame], [tabdeep, deep]].forEach(function(t){ t[0].tag('on', t[1].hidden ? -1 : 1); t[0].setAttribute('aria-pressed', !t[1].hidden) });
};
tabframe.ear('click', function(){ NEW.pick('frame') });
tabdeep.ear('click', function(){ NEW.pick('deep') });
</script>
