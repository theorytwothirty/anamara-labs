<!doctype html>
<meta charset="utf-8">
<title>Sign up · MindFlow</title>
<link rel="stylesheet" href="gun/kit/web.css"><link rel="stylesheet" href="app.css">
<script src="gun/kit/web.js"></script>

<div class="pad slim flow">
  <p class="calm"><span><a class="mark" href="home.html">MindFlow</a> <span class="soft tiny">by Anamara Labs</span></span></p>
  <form id="form" class="card list">
    <h2>Start practicing</h2>
    <p class="soft">Create your account for personalized guided practice. Each session builds on what you've shared before; you can see this and turn it off in Settings.</p>
    <label>Name <input name="name" required autocomplete="name" placeholder="Your name"></label>
    <label>Email <input name="mail" type="email" required autocomplete="email" placeholder="you@example.com"></label>
    <label>Password <input name="pass" type="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="At least 8 characters"></label>
    <p name="err" class="bad" hidden></p>
    <button class="big" name="act">Create account</button>
  </form>
  <p class="soft calm">Already have an account? <a href="sign.html">Sign in</a></p>
  <p class="soft tiny calm">MindFlow supports personal growth. It isn't therapy or medical care.</p>
</div>

<script src="gun/kit/dom.js"></script>
<script src="env.js"></script>
<script src="api.js"></script>
<script src="nav.js"></script>
<script>
kit.createServer(function(req, res){ res.send(kit.bind(document, {err: null})) });

var JOIN = {};
JOIN.send = async function(eve, f){ eve.preventDefault();
  f = Object.fromEntries(new FormData(form));
  kit.bind(document, {err: null, act: 'Creating…'}); form.act.disabled = true;
  try{
    await API.ask('/auth/register', {name: f.name, email: f.mail, password: f.pass});
    // Email verification isn't required to sign in, so sign straight in for a smooth first run.
    API.keep(await API.ask('/auth/login', {email: f.mail, password: f.pass}));
    form.reset(); NAV.go('dash.html');
  }catch(err){ kit.bind(document, {err: err.message}) }
  kit.bind(document, {act: 'Create account'}); form.act.disabled = false;
};
form.ear('submit', JOIN.send);
</script>
