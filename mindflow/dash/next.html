<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../gun/kit/web.css"><link rel="stylesheet" href="../app.css">
<script src="../gun/kit/web.js"></script>

<section class="card list next">
  <p class="cap">Your next real-world action</p>
  <div id="one" class="list" hidden>
    <p name="text" class="say"></p>
    <span class="line tiny soft"><span name="want" class="tag"></span><span name="due"></span><span name="more" class="grow"></span></span>
    <div class="line"><button id="did" class="grow big">I did it</button><button id="not" class="grow">Not this time</button></div>
    <p name="err" class="bad" hidden></p>
  </div>
  <iframe id="how" src="how.html" title="How did it go?" hidden></iframe>
  <div id="none" class="list" hidden>
    <p class="soft">No step planned right now. After a practice, choose one small thing to try for real.</p>
    <a class="hug" href="../new.html">Start a practice</a>
  </div>
</section>

<style>
.next { background: linear-gradient(160deg, var(--lilact), var(--card) 70%); }
</style>

<script src="../gun/kit/dom.js"></script>
<script src="../env.js"></script>
<script src="../api.js"></script>
<script src="../pen.js"></script>
<script src="../nav.js"></script>
<script>
// body: [action] planned, newest first. Shows the oldest planned step; after reflecting on it, the next one.
kit.createServer(function(req, res){ NEXT.list = (req.body || []).slice().reverse(); how.hidden = true; NEXT.draw(); res.send(document) });

var NEXT = {list: []};
NEXT.draw = function(a){ a = how.hidden && NEXT.list[0];
  one.hidden = !a; none.hidden = !how.hidden || !!a;
  a && kit.bind(one, {text: a.text, want: a.want || null, due: a.due ? 'by ' + PEN.date(a.due) : null,
    more: 1 < NEXT.list.length ? '+' + (NEXT.list.length - 1) + ' more planned' : null, err: null});
};
NEXT.ask = function(tried, a){ a = NEXT.list[0];
  how.hidden = false; NEXT.draw();
  kit.fetch(how, {id: a.id, text: a.text, tried: tried}).catch(function(err){ how.hidden = true; NEXT.draw(); kit.bind(one, {err: err.message}) });
};
// The reflection says 'reflect' once it is saved, and again with {back: true} when the person is ready to move on.
kit.ear('reflect', function(eve){ eve.preventDefault();
  if(eve.detail && eve.detail.back){ how.hidden = true; return NEXT.draw() }
  NEXT.list = NEXT.list.filter(function(a){ return a.id !== eve.detail.id });
});
did.ear('click', function(){ NEXT.ask(true) });
not.ear('click', function(){ NEXT.ask(false) });
</script>
