<!doctype html>
<meta charset="utf-8">
<title>Sign in · MindFlow</title>
<link rel="stylesheet" href="gun/kit/web.css"><link rel="stylesheet" href="app.css">
<script src="gun/kit/web.js"></script>

<div class="pad slim flow">
  <p class="calm"><span><a class="mark" href="home.html">MindFlow</a> <span class="soft tiny">by Anamara Labs</span></span></p>
  <form id="form" class="card list">
    <h2>Welcome back</h2>
    <p class="soft">Sign in to continue your practice.</p>
    <label>Email <input name="mail" type="email" required autocomplete="email" placeholder="you@example.com"></label>
    <label>Password <input name="pass" type="password" required autocomplete="current-password"></label>
    <p name="err" class="bad" hidden></p>
    <button class="big" name="act">Sign in</button>
    <a class="tiny calm" href="lost.html">Forgot your password?</a>
  </form>
  <p class="soft calm">New to MindFlow? <a href="join.html">Create an account</a></p>
</div>

<script src="gun/kit/dom.js"></script>
<script src="env.js"></script>
<script src="api.js"></script>
<script src="nav.js"></script>
<script>
kit.createServer(function(req, res){ res.send(kit.bind(document, {err: null})) });

var SIGN = {};
SIGN.send = async function(eve, f){ eve.preventDefault();
  f = Object.fromEntries(new FormData(form));
  kit.bind(document, {err: null, act: 'Signing in…'}); form.act.disabled = true;
  try{
    API.keep(await API.ask('/auth/login', {email: f.mail, password: f.pass}));
    form.reset(); NAV.go('dash.html');
  }catch(err){ kit.bind(document, {err: err.message}) }
  kit.bind(document, {act: 'Sign in'}); form.act.disabled = false;
};
form.ear('submit', SIGN.send);
</script>
