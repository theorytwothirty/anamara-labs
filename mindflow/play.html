<!doctype html>
<meta charset="utf-8">
<title>Session · MindFlow</title>
<link rel="stylesheet" href="gun/kit/web.css"><link rel="stylesheet" href="app.css">
<script src="gun/kit/web.js"></script>

<div class="pad flow">
  <nav class="line"><a class="btn ghost hug" href="shelf.html">← Exit to library</a></nav>
  <p name="load" class="soft wait calm">Loading your session…</p>
  <div name="note" class="empty list" hidden>
    <h2 name="head"></h2>
    <p name="text"></p>
    <a class="btn hug" href="shelf.html">Back to library</a>
  </div>
  <div id="ready" class="flow" hidden>
    <ol class="steps" aria-label="Steps"><li id="one" class="now">1 · Listen</li><li id="two">2 · Reflect</li></ol>
    <iframe id="deck" src="play/deck.html" title="Player"></iframe>
    <iframe id="rate" src="play/rate.html" title="Reflect on this session" hidden></iframe>
    <details class="fold"><summary>Read the script</summary><div id="box" class="list soft"></div></details>
  </div>
</div>
<template id="row"><div><p name="text"></p></div></template>

<script src="gun/kit/dom.js"></script>
<script src="env.js"></script>
<script src="api.js"></script>
<script src="fit.js"></script>
<script src="row.js"></script>
<script src="nav.js"></script>
<script>
// body: {id}. Loads that session and its audio, or explains why it can't play yet.
kit.createServer(async function(req, res){
  var id = (req.body || {}).id, s;
  PLAY.reset(id); kit.bind(document, {load: 'Loading your session…', note: null});
  try{ s = FIT.sess(await API.ask('/sessions/' + encodeURIComponent(id))) }
  catch(err){ return res.send(kit.bind(document, {load: null, note: {head: "Couldn't load this session", text: err.message}})) }
  if('failed' === s.state){ return res.send(kit.bind(document, {load: null, note: {head: "This session didn't finish", text: s.err || 'Something went wrong while creating it. Try making a new one.'}})) }
  if('ready' !== s.state){ return res.send(kit.bind(document, {load: null, note: {head: 'Still being created…', text: "This session isn't ready yet. Check back in a minute or two."}})) }
  ROW.fill(box, row, s.text.split('\n\n').map(function(t){ return {text: t} }));
  ready.hidden = false;
  try{ PLAY.src = s.audio ? await API.link('/sessions/' + encodeURIComponent(id) + '/audio') : '' }catch(err){ PLAY.src = '' }
  kit.fetch(deck, {src: PLAY.src, title: s.title, bg: await PLAY.bg()}).catch(Boolean);
  res.send(kit.bind(document, {load: null}));
});

var PLAY = {};
// Whether the person wants the soft background (Settings → Background sounds); on if it can't be read.
PLAY.bg = async function(){ try{ return FIT.user(await API.ask('/users/me')).pref.bg }catch(err){ return true } };
PLAY.step = function(n){ one.tag('now', 1 === n ? 1 : -1); two.tag('now', 2 === n ? 1 : -1); deck.hidden = 2 === n; rate.hidden = 1 === n };
PLAY.reset = function(id){
  PLAY.id = id; PLAY.saved = 0; ready.hidden = true; PLAY.step(1);
  PLAY.src && URL.revokeObjectURL(PLAY.src); PLAY.src = '';
};
// The player says 'done' when audio ends or "Finish" is tapped; record it at once, then ask for a reflection.
PLAY.done = function(eve){ eve.preventDefault();
  if(!PLAY.saved){ PLAY.saved = 1; API.ask('/sessions/' + encodeURIComponent(PLAY.id) + '/complete', {rating: null, user_notes: null}).catch(function(){ PLAY.saved = 0 }) }
  PLAY.step(2);
  kit.fetch(rate, {id: PLAY.id}).catch(Boolean);
};
kit.ear('done', PLAY.done);
</script>
