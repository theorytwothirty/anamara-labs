<!doctype html>
<meta charset="utf-8">
<title>Generating · MindFlow</title>
<link rel="stylesheet" href="gun/kit/web.css"><link rel="stylesheet" href="app.css">
<script src="gun/kit/web.js"></script>

<div class="pad list calm">
  <div class="orb wait"></div>
  <h1>Generating your session</h1>
  <p name="say" class="loud"></p>
  <p class="soft">This usually takes 1-2 minutes · <span name="secs">0</span>s elapsed</p>
</div>

<style>
.orb { width: 7em; height: 7em; margin: 2em auto; border-radius: 50%; background: radial-gradient(circle, var(--hue), var(--deep) 60%, transparent 70%); box-shadow: 0 0 3em var(--glow); }
</style>

<script>
// No body. Every request restarts the clock; there is no server progress, so stages follow elapsed time.
kit.createServer(function(req, res){
  WAIT.from = Date.now(); clearInterval(WAIT.tick); WAIT.tick = setInterval(WAIT.draw, 1000);
  res.send(WAIT.draw());
});

var WAIT = {};
WAIT.stage = [[0, 'Analyzing what you shared…'], [15, 'Crafting your personalized metaphor…'],
  [40, 'Weaving in Ericksonian and NLP language patterns…'], [70, 'Recording your session audio…'], [100, 'Almost ready, finishing touches…']];
WAIT.draw = function(secs, say){
  secs = Math.floor((Date.now() - WAIT.from) / 1000);
  WAIT.stage.forEach(function(s){ if(s[0] <= secs){ say = s[1] } });
  return kit.bind(document, {secs: secs, say: say});
};
</script>
