<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../../gun/kit/web.css"><link rel="stylesheet" href="../../app.css">
<script src="../../gun/kit/web.js"></script>

<section class="card list">
  <p class="cap">Explore this further</p>
  <h3>How does this land?</h3>
  <p class="soft tiny">Say what fits, what doesn't, or what you'd like to look at next.</p>
  <div id="box" class="list" aria-live="polite"></div>
  <form id="form" class="line">
    <input name="text" class="grow" required maxlength="1000" placeholder="Tell me how this resonates…" aria-label="Your reply">
    <button class="big" name="act">Send</button>
  </form>
  <p name="err" class="bad" hidden></p>
</section>
<template id="row"><div class="say"><span name="text"></span></div></template>

<style>
#box .say { font-family: var(--font); font-size: var(--t4); line-height: 1.5; padding: var(--s3) var(--s4); border-radius: var(--r2) var(--r2) var(--r2) 4px; background: var(--lilact); max-width: 88%; justify-self: start; }
#box .say.me { justify-self: end; border-radius: var(--r2) var(--r2) 4px var(--r2); background: var(--roset); }
#form input { flex: 1 1 12em; border-radius: 999px; }
#form button { flex: 0 0 auto; }
</style>

<script src="../../gun/kit/dom.js"></script>
<script src="../../env.js"></script>
<script src="../../api.js"></script>
<script src="../../fit.js"></script>
<script src="../../row.js"></script>
<script>
// body: a reframe conversation {id, msgs: [{who, text}]}.
kit.createServer(function(req, res){ CHAT.draw(req.body); res.send(kit.bind(document, {err: null})) });

var CHAT = {};
CHAT.draw = function(conv){ CHAT.conv = conv;
  ROW.fill(box, row, conv.msgs, function(el, m){ el.tag(m.who, 1) });
};
CHAT.send = async function(eve, text){ eve.preventDefault();
  text = form.text.value; form.text.value = ''; form.act.disabled = true; kit.bind(document, {err: null});
  try{
    CHAT.draw(FIT.frame(await API.ask('/reframes/' + CHAT.conv.id + '/messages', {message: text})));
    kit.say(CHAT.conv, 'frame');
  }catch(err){ form.text.value = text; kit.bind(document, {err: err.message}) }
  form.act.disabled = false;
};
form.ear('submit', CHAT.send);
</script>
