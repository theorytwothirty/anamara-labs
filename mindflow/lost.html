<!doctype html>
<meta charset="utf-8">
<title>Forgot password · MindFlow</title>
<link rel="stylesheet" href="gun/kit/web.css"><link rel="stylesheet" href="app.css">
<script src="gun/kit/web.js"></script>

<div class="pad slim flow">
  <p class="calm"><span><a class="mark" href="home.html">MindFlow</a> <span class="soft tiny">by Anamara Labs</span></span></p>
  <form id="form" class="card list">
    <h2>Reset your password</h2>
    <p class="soft">Enter your email and we'll send you a reset link.</p>
    <label>Email <input name="mail" type="email" required autocomplete="email" placeholder="you@example.com"></label>
    <p name="err" class="bad" hidden></p>
    <button class="big" name="act">Send reset link</button>
    <a class="tiny calm" href="sign.html">Remembered it? Sign in</a>
  </form>
  <div id="sent" class="card list" hidden>
    <h2>Check your email</h2>
    <p class="soft">If an account exists for <b name="mail"></b>, we've sent a link to reset your password. It expires in 1 hour.</p>
    <a class="btn" href="sign.html">Back to sign in</a>
  </div>
</div>

<script src="gun/kit/dom.js"></script>
<script src="env.js"></script>
<script src="api.js"></script>
<script src="nav.js"></script>
<script>
kit.createServer(function(req, res){ form.hidden = false; sent.hidden = true; res.send(kit.bind(document, {err: null})) });

var LOST = {};
LOST.send = async function(eve, f){ eve.preventDefault();
  f = Object.fromEntries(new FormData(form));
  kit.bind(document, {err: null, act: 'Sending…'}); form.act.disabled = true;
  try{
    await API.ask('/auth/request-password-reset', {email: f.mail});
    kit.bind(sent, {mail: f.mail}); form.hidden = true; sent.hidden = false;
  }catch(err){ kit.bind(document, {err: err.message}) }
  kit.bind(document, {act: 'Send reset link'}); form.act.disabled = false;
};
form.ear('submit', LOST.send);
</script>
